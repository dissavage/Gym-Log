<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="color-scheme" content="dark">
  <title>Health Log</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="banners" aria-live="polite"></div>

<main id="main">
  <section id="view-today" class="view" aria-label="Today"></section>
  <section id="view-workout" class="view" aria-label="Workout" hidden></section>
  <section id="view-history" class="view" aria-label="History" hidden></section>
  <section id="view-insights" class="view" aria-label="Insights" hidden></section>
  <section id="view-more" class="view" aria-label="More" hidden></section>
</main>

<div id="rest-pill" class="rest-pill" hidden></div>

<nav class="tabbar" aria-label="Main">
  <button type="button" class="tab-btn" data-view="today" aria-current="page"><span class="tab-icon" aria-hidden="true">🏠</span><span>Today</span></button>
  <button type="button" class="tab-btn" data-view="workout"><span class="tab-icon" aria-hidden="true">🏋️</span><span>Workout</span></button>
  <button type="button" class="tab-btn" data-view="history"><span class="tab-icon" aria-hidden="true">📋</span><span>History</span></button>
  <button type="button" class="tab-btn" data-view="insights"><span class="tab-icon" aria-hidden="true">📈</span><span>Insights</span></button>
  <button type="button" class="tab-btn" data-view="more"><span class="tab-icon" aria-hidden="true">⚙️</span><span>More</span></button>
</nav>

<div id="toast-root" aria-live="polite"></div>

<script src="js/util.js"></script>
<script src="js/units.js"></script>
<script src="js/schema.js"></script>
<script src="js/domain.js"></script>
<script src="js/db.js"></script>
<script src="js/repo.js"></script>
<script src="js/ui/toast.js"></script>
<script src="js/ui/sheet.js"></script>
<script src="js/ui/entry.js"></script>
<script src="js/ui/rest.js"></script>
<script src="js/ui/exercises.js"></script>
<script src="js/ui/workout.js"></script>
<script src="js/ui/today.js"></script>
<script src="js/ui/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
