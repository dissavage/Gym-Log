<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0C0E">
  <meta name="color-scheme" content="dark light">
  <script>
    // Apply the saved theme before first paint (dark unless the person chose otherwise)
    try {
      var t = (JSON.parse(localStorage.getItem('healthlog.settings') || '{}').theme) || 'dark';
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
    } catch (e) { document.documentElement.dataset.theme = 'dark'; }

    // iOS home-screen apps with a black-translucent status bar draw from the very top, under the status
    // bar, but get a viewport that's short by its height, leaving an empty strip at the bottom. When the
    // viewport really is short, stretch the page by exactly the missing height (html.fill-screen in
    // styles.css). In Safari, or once iOS fixes it, nothing changes.
    (function () {
      function fit() {
        var root = document.documentElement;
        var standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
        var full = matchMedia('(orientation: landscape)').matches ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
        var missing = standalone ? Math.round(full - window.innerHeight) : 0;
        var on = missing > 0 && missing <= 100;
        root.classList.toggle('fill-screen', on);
        root.style.setProperty('--fill-screen', (on ? missing : 0) + 'px');
      }
      fit();
      addEventListener('resize', fit);
      addEventListener('orientationchange', fit);
    })();
  </script>
  <title>Health Log</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Health Log">
  <!-- Bump ?v= (and VERSION in sw.js) on every release so phones never mix cached old and new files -->
  <link rel="stylesheet" href="styles.css?v=14">
</head>
<body>

<div id="banners" aria-live="polite"></div>

<main id="main">
  <section id="view-today" class="view" aria-label="Today"></section>
  <section id="view-workout" class="view" aria-label="Workout" hidden></section>
  <section id="view-history" class="view" aria-label="History" hidden></section>
  <section id="view-insights" class="view" aria-label="Insights" hidden></section>
  <section id="view-more" class="view" aria-label="More" hidden></section>
</main>

<div id="rest-pill" class="rest-pill" hidden></div>

<nav class="tabbar" aria-label="Main">
  <button type="button" class="tab-btn" data-view="today" aria-label="Today" aria-current="page"><span class="tab-icon"></span></button>
  <button type="button" class="tab-btn" data-view="workout" aria-label="Workout"><span class="tab-icon"></span></button>
  <button type="button" class="tab-btn" data-view="history" aria-label="History"><span class="tab-icon"></span></button>
  <button type="button" class="tab-btn" data-view="insights" aria-label="Insights"><span class="tab-icon"></span></button>
  <button type="button" class="tab-btn" data-view="more" aria-label="More"><span class="tab-icon"></span></button>
</nav>

<div id="toast-root" aria-live="polite"></div>
